name: expense_tracker
description: A lightweight expense tracking mobile application with offline support
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2
  
  # Code Generation Annotations
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # HTTP & API
  dio: ^5.3.2
  dartz: ^0.10.1
  http_parser: ^4.0.2
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # UI & Utils
  intl:
  image_picker: ^1.0.4
  
  # Other
  cupertino_icons: ^1.0.6

  flutter_keyboard_visibility: ^5.4.1
  cached_network_image: ^3.3.0
  bloc: ^8.1.2
  tf_dio_cache: ^1.0.2
#  fluttertoast:
  auto_route: ^7.8.4
  flutter_easyloading: ^3.0.5
  flutter_spinkit: ^5.2.0
  firebase_messaging: ^14.7.6
  firebase_core: ^2.24.0
  flutter_local_notifications: ^18.0.1
  flutter_phoenix: ^1.1.1
  animations: ^2.0.8
  google_fonts: ^6.1.0
  url_launcher: ^6.2.1
  flutter_launcher_icons: ^0.13.1
  permission_handler: ^11.0.1
#  file_picker:
  flutter_svg: ^2.0.9
  firebase_analytics: ^10.7.2
  flutter_screenutil: ^5.9.0
  internet_connectivity_checker: ^1.0.2
  simple_connection_checker: ^0.2.1
  adaptive_theme: ^3.4.1
  collection: ^1.17.2
  process_run: ^0.14.1+3
  get: ^4.6.6
  shimmer: ^3.0.0
  intl_utils:
  firebase_database:
  firebase_remote_config:
  sentry_flutter: ^8.13.2
  top_snackbar_flutter: ^3.2.0
  flutter_rounded_date_picker: ^3.0.4
  device_info_plus:
  device_preview: ^1.2.0
  share_plus:
  firebase_dynamic_links:

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.1
  auto_route_generator: ^7.3.2
  # Testing
  mockito: ^5.4.2
  
  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Add assets here if needed
  # assets:
  #   - images/

flutter_icons:
  android: "launcher_icon"
