plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

apply plugin: 'com.google.gms.google-services'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def dartEnvironmentVariables = [
        APP_APP_NAME_EN: 'Foz',
        APP_APP_NAME_AR: 'فوز',
        APP_ID         : 'com.tracker.app.stage',
]
if (project.hasProperty('dart-defines')) {

    dartEnvironmentVariables = dartEnvironmentVariables + project.property('dart-defines')
            .split(',')
            .collectEntries { entry ->

                def pair = new String(entry.decodeBase64(), 'UTF-8').split('=')
                println "ENV VAR: ${pair.first()} = ${pair.last()}"
                [(pair.first()): pair.last()]
            }

//    String encoded = "QVBQX0FQUF9OQU1FX0FSPdij2LPYsyDYr9mK2YE="
//    def pair = new String(encoded.decodeBase64(), 'UTF-8')
//    println "AA ${pair}"

}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
android {

    namespace 'com.tracker.app.stage'
    compileSdk 35
    ndkVersion flutter.ndkVersion

    lint {
        baseline = file("lint-baseline.xml")
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId dartEnvironmentVariables.APP_ID
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion 24
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }


    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
            applicationVariants.all { variant ->
                variant.outputs.all {
                    def appName = "FOZ_V_"
                    def newName = "${appName}${defaultConfig.versionName}_${defaultConfig.versionCode}.apk"
                    outputFileName = newName
                }
            }
        }
    }

    flavorDimensions "app"
    productFlavors {
        dev {
            dimension "app"
            applicationId dartEnvironmentVariables.APP_ID
            copy {
                from 'src/stage/'
                include '*.json'
                into '.'
            }
        }
        prod {
            dimension "app"
            applicationId dartEnvironmentVariables.APP_ID
            copy {
                from 'src/prod/'
                include '*.json'
                into '.'
            }
        }
        stage {
            dimension "app"
            applicationId dartEnvironmentVariables.APP_ID
            copy {
                from 'src/stage/'
                include '*.json'
                into '.'
            }
        }
    }

}

flutter {
    source '../..'
}

dependencies {
    configurations.all {
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
        }
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'com.google.firebase:firebase-appcheck-safetynet:16.1.2'

}
